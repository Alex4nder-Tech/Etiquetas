<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generador Etiquetas</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body {

  font-family: 'Orbitron', sans-serif;

  padding:20px;

  background:
  radial-gradient(circle at top left, #00f0ff22, transparent 30%),
  radial-gradient(circle at bottom right, #0066ff33, transparent 30%),
  linear-gradient(135deg, #050816, #0a1224, #111827);

  min-height:100vh;

  color:white;

}

/* CONTENEDOR */

.container {

  background: rgba(15, 23, 42, 0.75);

  backdrop-filter: blur(12px);

  border:1px solid rgba(0,255,255,0.2);

  padding:30px;

  border-radius:20px;

  max-width:1400px;

  margin:auto;

  box-shadow:
  0 0 25px rgba(0,255,255,0.15),
  0 0 60px rgba(0,150,255,0.15);

}

/* HEADER */

.header {

  display:flex;

  align-items:center;

  justify-content:center;

  gap:18px;

  margin-bottom:30px;

}

.header img {

  width:75px;

  height:75px;

  border-radius:14px;

  box-shadow:
  0 0 15px #00d9ff,
  0 0 30px #0088ff;

}

.header h2 {

  margin:0;

  font-size:34px;

  color:#00e5ff;

  text-shadow:
  0 0 10px #00e5ff,
  0 0 20px #0088ff;

}

/* SUBTITULO */

.subtitulo {

  text-align:left;

  margin-top:5px;

  color:#67e8f9;

  font-size:14px;

  letter-spacing:2px;

}

/* GRID PRINCIPAL */

.main-grid {

  display:grid;

  grid-template-columns: 1fr 1fr;

  gap:30px;

}

/* PANEL */

.panel {

  background: rgba(255,255,255,0.03);

  border:1px solid rgba(0,255,255,0.1);

  border-radius:18px;

  padding:20px;

  box-shadow:
  inset 0 0 15px rgba(0,255,255,0.05);

}

/* LABELS */

label, h3 {

  color:#7dd3fc;

  font-size:14px;

  letter-spacing:1px;

}

/* INPUTS */

input, select {

  width:100%;

  padding:14px;

  margin:10px 0;

  border-radius:12px;

  border:1px solid rgba(0,255,255,0.2);

  background: rgba(255,255,255,0.05);

  color:white;

  font-size:14px;

  box-sizing:border-box;

  outline:none;

  transition:0.3s;

  appearance:none;

}

/* OPCIONES DEL SELECT */

select option {

  background:#0f172a;

  color:#ffffff;

}

/* PLACEHOLDER */

input::placeholder {

  color:#94a3b8;

}

/* INPUT FOCUS */

input:focus,
select:focus {

  border:1px solid #00e5ff;

  box-shadow:
  0 0 10px #00e5ff;

}

/* BOTONES */

button {

  width:100%;

  padding:14px;

  margin-top:12px;

  border:none;

  border-radius:12px;

  background: linear-gradient(90deg, #00c6ff, #0072ff);

  color:white;

  font-weight:bold;

  font-size:14px;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 0 12px rgba(0,198,255,0.5);

}

/* HOVER BOTON */

button:hover {

  transform:translateY(-2px);

  box-shadow:
  0 0 18px #00e5ff,
  0 0 35px #0072ff;

}

/* RESULTADOS */

.resultado {

  margin-top:18px;

  font-weight:bold;

  background: rgba(0,0,0,0.4);

  padding:15px;

  border-radius:12px;

  word-break: break-all;

  border-left:4px solid #00e5ff;

  color:#67e8f9;

  box-shadow:
  inset 0 0 12px rgba(0,255,255,0.1);

}

/* HIDDEN */

.hidden {

  display:none;

}

/* RESPONSIVE */

@media(max-width: 900px){

.main-grid {

  grid-template-columns:1fr;

}

}

/* PRINT */

@media print {

  body * {

    visibility:hidden;

  }

  .print-area,
  .print-area * {

    visibility:visible;

  }

  .print-area {

    position:absolute;

    top:40%;

    left:10%;

    font-size:16px;

    color:black;

  }

}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

  <img src="logo.png" alt="Logo">

  <div>

    <h2>Generador Etiquetas</h2>

    <div class="subtitulo">
      by: KALZ
    </div>

  </div>

</div>

<!-- GRID -->

<div class="main-grid">

<!-- PANEL IZQUIERDO -->

<div class="panel">

<h3>GENERADOR DE ETIQUETAS</h3>

<!-- CATEGORIA -->

<label>Categoría</label>

<select id="categoria"
onchange="cargarTipos(); actualizarFinalizacion()">

<option value="campo">Trabajo Campo</option>

<option value="edificacion">Edificación</option>

<option value="clientes">CLIENTES</option>

</select>

<!-- ZONA -->

<label>Zona</label>

<select id="zona">

<option value="TN">TN</option>

<option value="MD">MD</option>

</select>

<!-- TIPO -->

<label>Tipo</label>

<select id="tipo"></select>

<!-- INPUTS -->

<input id="tarea" placeholder="Número de tarea">

<input id="spliter" placeholder="Spliter">

<input id="tecnico" placeholder="Técnico">

<!-- LIBERACION -->

<div id="liberacionBox" class="hidden">

<label>TAREA LIBERACION</label>

<select id="modoLiberacion"
onchange="mostrarInputLiberacion()">

<option value="NA">N/A</option>

<option value="numero">Ingresar número</option>

</select>

<input id="numeroLiberacion"
class="hidden"
placeholder="Número TAREA LIBERACION">

</div>

<!-- BOTON -->

<button onclick="generar()">

⚡ GENERAR ETIQUETA

</button>

<!-- RESULTADO -->

<div class="resultado print-area" id="resultado"></div>

<!-- IMPRIMIR -->

<button onclick="window.print()">

🖨 IMPRIMIR ETIQUETA

</button>

</div>

<!-- PANEL DERECHO -->

<div class="panel">

<h3>FINALIZACIÓN</h3>

<input id="caja"
placeholder="Nombre de caja">

<input id="edificio"
class="hidden"
placeholder="Nombre de edificación">

<input id="coordenadas"
placeholder="Coordenadas">

<button onclick="generarFinalizacion()">

🚀 GENERAR FRASE

</button>

<div class="resultado" id="finalizacion"></div>

</div>

</div>

</div>

<script>

/* CARGAR TIPOS */

function cargarTipos(){

let categoria =
document.getElementById("categoria").value;

let tipo =
document.getElementById("tipo");

let liberacionBox =
document.getElementById("liberacionBox");

tipo.innerHTML = "";

let opciones = [];

if(categoria === "campo"){

opciones = [
"SATURACION",
"COBERTURA",
"MIGRACION",
"REINGENIERIA"
];

liberacionBox.classList.add("hidden");

}else if(categoria === "edificacion"){

opciones = [
"SPLITTER_INICIAL",
"SPLITTER_ADICIONAL"
];

liberacionBox.classList.add("hidden");

}else{

opciones = [
"SATURACION",
"COBERTURA",
"MIGRACION",
"REINGENIERIA"
];

liberacionBox.classList.remove("hidden");

}

opciones.forEach(o=>{

let op =
document.createElement("option");

op.value = o;

op.text = o;

tipo.appendChild(op);

});

}

/* MOSTRAR INPUT LIBERACION */

function mostrarInputLiberacion(){

let modo =
document.getElementById("modoLiberacion").value;

let input =
document.getElementById("numeroLiberacion");

if(modo === "numero"){

input.classList.remove("hidden");

}else{

input.classList.add("hidden");

}

}

/* ACTUALIZAR FINALIZACION */

function actualizarFinalizacion(){

let categoria =
document.getElementById("categoria").value;

let edificio =
document.getElementById("edificio");

if(categoria === "edificacion"){

edificio.classList.remove("hidden");

}else{

edificio.classList.add("hidden");

}

}

/* GENERAR ETIQUETA */

function generar(){

let categoria =
document.getElementById("categoria").value;

let zona =
document.getElementById("zona").value;

let tipo =
document.getElementById("tipo").value;

let tarea =
document.getElementById("tarea").value;

let spliter =
document.getElementById("spliter").value;

let tecnico =
document.getElementById("tecnico").value;

let etiqueta = "";

if(categoria === "campo"){

if(tipo === "MIGRACION"){

etiqueta =
`${tipo}_${zona}-ZONA-ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}`;

}else{

etiqueta =
`${tipo}_${zona}-ZONA_ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}`;

}

}else if(categoria === "edificacion"){

etiqueta =
`EDIFICACION_${zona}-${tipo}-TAREA_${tarea}:${spliter}-${tecnico}`;

}else{

let modo =
document.getElementById("modoLiberacion").value;

let numeroLiberacion =
document.getElementById("numeroLiberacion").value;

let parteLiberacion = "";

if(modo === "NA"){

parteLiberacion = "TAREA_N/A";

}else if(numeroLiberacion !== ""){

parteLiberacion =
`TAREA_${numeroLiberacion}`;

}else{

parteLiberacion = "TAREA_N/A";

}

if(tipo === "MIGRACION"){

etiqueta =
`${tipo}_${zona}-ZONA-ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}-${parteLiberacion}`;

}else{

etiqueta =
`${tipo}_${zona}-ZONA_ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}-${parteLiberacion}`;

}

}

document.getElementById("resultado").innerText =
etiqueta;

}

/* GENERAR FINALIZACION */

function generarFinalizacion(){

let categoria =
document.getElementById("categoria").value;

let spliter =
document.getElementById("spliter").value;

let caja =
document.getElementById("caja").value;

let edificio =
document.getElementById("edificio").value;

let coordenadas =
document.getElementById("coordenadas").value;

let texto = "";

if(categoria === "edificacion"){

texto =
`Se instaló caja: ${caja}, edificio: ${edificio}, splitter: ${spliter}, coordenadas: ${coordenadas}`;

}else{

texto =
`Se instaló caja: ${caja}, edificio: N/A, splitter: ${spliter}, coordenadas: ${coordenadas}`;

}

document.getElementById("finalizacion").innerText =
texto;

}

/* INICIAR */

cargarTipos();

actualizarFinalizacion();

</script>

</body>
</html>
