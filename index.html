<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>KALZ GIS TOOL</title>

<link rel="icon" type="image/png" href="logo.png">


<style>

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;

padding:25px;

min-height:100vh;

font-family:'Rajdhani',sans-serif;

background:#090909;

color:white;

}



.container{

max-width:1400px;

margin:auto;

background:#151515;

padding:30px;

border-radius:20px;

border:1px solid #333;

box-shadow:
0 20px 50px #000;

}




.header{

display:flex;

align-items:center;

justify-content:center;

gap:20px;

margin-bottom:35px;

}




.header img{

width:95px;

height:95px;

object-fit:cover;

border-radius:18px;

border:2px solid #ff8800;

box-shadow:
0 0 20px #ff8800;

}





.header h2{

margin:0;

font-size:38px;

color:#ff8800;

text-shadow:
0 0 15px #ff8800;

}





.subtitulo{

color:#aaa;

letter-spacing:3px;

font-size:18px;

}




.main-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

}





.panel{

background:#1c1c1c;

padding:25px;

border-radius:18px;

border:1px solid #292929;

box-shadow:
inset 0 0 20px #000;

}




h3,label{

color:#ff8800;

font-weight:700;

}






input,select{


width:100%;

padding:14px;

margin:10px 0;

background:#252525;

border:none;

border-radius:12px;

color:white;

font-size:15px;


}



input:focus,
select:focus{

outline:none;

box-shadow:
0 0 0 2px #ff8800;

}



select option{

background:#252525;

}







button{


width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:12px;


background:#ff8800;


color:#000;

font-weight:bold;

font-size:16px;

cursor:pointer;


transition:.3s;

}



button:hover{

background:#ffaa33;

transform:translateY(-2px);

}







.resultado{


margin-top:15px;

padding:18px;


background:#101010;


border-radius:12px;


border-left:5px solid #ff8800;


color:#ff8800;


word-break:break-all;


}





.hidden{

display:none;

}





@media(max-width:900px){

.main-grid{

grid-template-columns:1fr;

}

}






@media print{


body *{

visibility:hidden;

}


.print-area,
.print-area *{

visibility:visible;

}



.print-area{

position:absolute;

top:40%;

left:10%;

color:black;

}



}


</style>


</head>


<body>




<div class="container">



<div class="header">


<img src="logo.png">


<div>


<h2>

KALZ GIS TOOL

</h2>


<div class="subtitulo">

Generador Etiquetas<br>

by: KALZ

</div>


</div>


</div>







<div class="main-grid">





<div class="panel">


<h3>

GENERADOR DE ETIQUETAS

</h3>




<label>Categoría</label>


<select id="categoria"
onchange="cargarTipos();actualizarFinalizacion()">



<option value="campo">

Trabajo Campo

</option>



<option value="edificacion">

Edificación

</option>



<option value="clientes">

CLIENTES

</option>



</select>






<label>Zona</label>


<select id="zona">


<option value="TN">

TN

</option>


<option value="MD">

MD

</option>


</select>







<label>Tipo</label>


<select id="tipo">

</select>






<input id="tarea"
placeholder="Número tarea">



<input id="spliter"
placeholder="Spliter">



<input id="tecnico"
placeholder="Técnico">







<div id="liberacionBox" class="hidden">



<label>

TAREA LIBERACION

</label>


<select id="modoLiberacion"
onchange="mostrarInputLiberacion()">



<option value="NA">

N/A

</option>



<option value="numero">

Ingresar número

</option>


</select>




<input id="numeroLiberacion"
class="hidden"
placeholder="Número liberación">


</div>






<button onclick="generar()">

⚡ GENERAR ETIQUETA

</button>






<div id="resultado"
class="resultado print-area">

</div>





<button onclick="window.print()">

🖨 IMPRIMIR

</button>



</div>
<!-- FINALIZACION -->

<div class="panel">


<h3>

FINALIZACIÓN

</h3>





<input id="caja"
placeholder="Nombre caja">





<input id="edificio"
class="hidden"
placeholder="Edificación">





<input id="coordenadas"
placeholder="Coordenadas">





<button onclick="generarFinalizacion()">


GENERAR FRASE


</button>





<div id="finalizacion"
class="resultado">

</div>




</div>





</div>





</div>









<script>



function cargarTipos(){


let categoria =
document.getElementById("categoria").value;


let tipo =
document.getElementById("tipo");


let liberacion =
document.getElementById("liberacionBox");


tipo.innerHTML="";


let opciones=[];



if(categoria=="campo"){


opciones=[

"SATURACION",
"COBERTURA",
"MIGRACION",
"REINGENIERIA"

];


liberacion.classList.add("hidden");


}





else if(categoria=="edificacion"){


opciones=[

"SPLITTER_INICIAL",
"SPLITTER_ADICIONAL"

];


liberacion.classList.add("hidden");


}





else{


opciones=[

"SATURACION",
"COBERTURA",
"MIGRACION",
"REINGENIERIA"

];


liberacion.classList.remove("hidden");


}






opciones.forEach(x=>{


let o=document.createElement("option");


o.value=x;


o.text=x;


tipo.appendChild(o);


});


}










function mostrarInputLiberacion(){


let modo =
document.getElementById("modoLiberacion").value;



let input =
document.getElementById("numeroLiberacion");




if(modo=="numero")


input.classList.remove("hidden");


else


input.classList.add("hidden");


}









function actualizarFinalizacion(){


let categoria =
document.getElementById("categoria").value;



let edificio =
document.getElementById("edificio");




if(categoria=="edificacion")


edificio.classList.remove("hidden");


else


edificio.classList.add("hidden");



}









function generar(){


let categoria =
document.getElementById("categoria").value;


let zona =
document.getElementById("zona").value;


let tipo =
document.getElementById("tipo").value;


let tarea =
document.getElementById("tarea").value;


let spliter =
document.getElementById("spliter").value;


let tecnico =
document.getElementById("tecnico").value;



let etiqueta="";







if(categoria=="campo"){



if(tipo=="MIGRACION"){



etiqueta =

`${tipo}_${zona}-ZONA-ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}`;



}

else{



etiqueta =

`${tipo}_${zona}-ZONA_ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}`;


}


}








else if(categoria=="edificacion"){



etiqueta =

`EDIFICACION_${zona}-${tipo}-TAREA_${tarea}:${spliter}-${tecnico}`;


}








else{


let modo =

document.getElementById("modoLiberacion").value;




let liberacion;



if(modo=="NA"){


liberacion="TAREA_N/A";


}

else{


liberacion=

`TAREA_${document.getElementById("numeroLiberacion").value}`;


}






etiqueta =


`${tipo}_${zona}-ZONA_ABIERTA-TAREA_${tarea}:${spliter}-${tecnico}-${liberacion}`;



}






document.getElementById("resultado").innerText = etiqueta;



}









function generarFinalizacion(){


let categoria =

document.getElementById("categoria").value;



let caja =

document.getElementById("caja").value;



let edificio =

document.getElementById("edificio").value;



let spliter =

document.getElementById("spliter").value;



let coordenadas =

document.getElementById("coordenadas").value;







let texto;







if(categoria=="edificacion"){



texto =


`Se instaló caja: ${caja}, edificio: ${edificio}, splitter: ${spliter}, coordenadas: ${coordenadas}`;



}





else{



texto =


`Se instaló caja: ${caja}, edificio: N/A, splitter: ${spliter}, coordenadas: ${coordenadas}`;



}






document.getElementById("finalizacion").innerText = texto;



}







cargarTipos();

actualizarFinalizacion();



</script>


</body>

</html>
